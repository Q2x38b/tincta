name: Tincta
options:
  bundleIdPrefix: com.tincta
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Tincta:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tincta
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
    resources:
      - path: Tincta/Assets.xcassets
      - path: Tincta/Resources
    info:
      path: Tincta/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSupportsIndirectInputEvents: YES
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: Tincta
        NSCameraUsageDescription: "Tincta uses the camera to scan cocktail recipes and turn them into editable entries in your library."
        NSPhotoLibraryUsageDescription: "Tincta reads images you pick so it can scan cocktail recipes from photos and create editable recipes."
        # Crimson Pro — bundled under SIL Open Font License v1.1.
        # License text ships in Tincta/Resources/Fonts/OFL.txt and is
        # also credited in AboutView.
        UIAppFonts:
          - CrimsonPro-Regular.ttf
          - CrimsonPro-Italic.ttf
          - CrimsonPro-Medium.ttf
          - CrimsonPro-MediumItalic.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tincta.app
        PRODUCT_NAME: Tincta
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM intentionally unset — set yours via Xcode's
        # Signing & Capabilities tab (Automatically manage signing) so this
        # file stays free of personal IDs. xcodebuild for the simulator
        # still works without one; device runs require it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
